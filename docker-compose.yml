services:
  postgres:
    image: postgres:16
    container_name: sltourism_postgres
    restart: always
    environment:
      POSTGRES_DB: sltourism
      POSTGRES_USER: sltourism_user
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sltourism_user -d sltourism"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
