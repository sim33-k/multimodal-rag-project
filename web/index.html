<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Lanka Tourism Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sri Lanka Tourism Search</h1>

<div class="tabs">
  <button class="tab active" data-tab="structured">Structured</button>
  <button class="tab" data-tab="semantic">Semantic</button>
  <button class="tab" data-tab="image">Image</button>
  <button class="tab" data-tab="hybrid">Hybrid</button>
</div>

<div class="tabbody active" id="tab-structured">
  <input type="text" id="q-structured" placeholder="Keyword (optional)">
  <button data-run="structured">Search</button>
  <label><input type="checkbox" id="free"> Free entry only</label>
  <label><input type="checkbox" id="unesco"> UNESCO only</label>
</div>

<div class="tabbody" id="tab-semantic">
  <input type="text" id="q-semantic" placeholder="e.g. a rainforest full of birds found nowhere else">
  <button data-run="semantic">Search</button>
</div>

<div class="tabbody" id="tab-image">
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp">
  <button data-run="image-upload">Find similar</button>
  <img id="preview" hidden alt="">
  <br>
  <input type="text" id="q-image" placeholder="e.g. golden sand and palm trees">
  <button data-run="image">Search images</button>
</div>

<div class="tabbody" id="tab-hybrid">
  <input type="text" id="q-hybrid" placeholder="e.g. which UNESCO sites in Matale are worth a day trip?">
  <button data-run="hybrid">Ask</button>
</div>

<p id="loading" hidden>Searching...</p>
<p id="error" class="error" hidden></p>

<div id="results" hidden>
  <div id="answer"></div>
  <p id="route" class="note"></p>
  <p id="count"></p>
  <ol id="cards"></ol>
  <details>
    <summary>Retrieved context passed to the model</summary>
    <pre id="context"></pre>
  </details>
</div>

<script src="app.js"></script>
</body>
</html>
