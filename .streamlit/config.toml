# Pinning the theme here rather than relying on injected CSS alone.
#
# Streamlit picks light or dark from the viewer's system setting by default. The
# custom stylesheet uses light backgrounds, so on a machine set to dark mode the
# widget text stayed near-white and became unreadable against them. Declaring the
# theme explicitly makes Streamlit render its own widgets - inputs, selects,
# checkboxes, tabs - in colours that match, on every machine.

[theme]
base = "light"
primaryColor = "#0E7C7B"           # ocean teal, used for focus rings and accents
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2EFE9"  # sand, used for the sidebar and inputs
textColor = "#1C2321"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
